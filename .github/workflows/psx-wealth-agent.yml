name: PSX Wealth Research

on:
  push:
    paths:
      - "psx-wealth-agent/**"
      - ".github/workflows/psx-wealth-agent.yml"
  workflow_dispatch:
  schedule:
    # 12:45 UTC is 17:45 PKT; GitHub schedules can be delayed.
    - cron: "45 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: psx-wealth-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PSX_OHLCV_URL_TEMPLATE: ${{ secrets.PSX_OHLCV_URL_TEMPLATE }}
      PSX_OHLCV_TOKEN: ${{ secrets.PSX_OHLCV_TOKEN }}
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest -v test_agent
      - name: Research PSX watchlist via authorized provider
        if: env.PSX_OHLCV_URL_TEMPLATE != ''
        run: python agent.py --source provider --output reports
      - name: Show pending feed configuration
        if: env.PSX_OHLCV_URL_TEMPLATE == ''
        run: echo "::warning::PSX historical endpoint returned HTTP 403 from GitHub runner. Configure approved PSX_OHLCV_URL_TEMPLATE secret; live retrieval is skipped until then."
      - name: Upload research report (no private holdings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-wealth-report
          path: psx-wealth-agent/reports/
          if-no-files-found: warn
          retention-days: 14
