name: PSX Wealth Research

on:
  push:
    paths:
      - "psx-wealth-agent/**"
      - ".github/workflows/psx-wealth-agent.yml"
  workflow_dispatch:
  schedule:
    # 12:45 UTC = 17:45 Pakistan; GitHub scheduling may be delayed.
    - cron: "45 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: psx-wealth-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CAPITALSTAKE_API_TOKEN: ${{ secrets.CAPITALSTAKE_API_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      PSX_OHLCV_URL_TEMPLATE: ${{ secrets.PSX_OHLCV_URL_TEMPLATE }}
      PSX_OHLCV_TOKEN: ${{ secrets.PSX_OHLCV_TOKEN }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
      PORTFOLIO_HOLDINGS_JSON: ${{ secrets.PORTFOLIO_HOLDINGS_JSON }}
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate all offline tests
        run: python -m unittest discover -p 'test_*.py' -v

      # Approved data hierarchy: licensed direct feed OR free daily bulk history.
      # An OCR screenshot never automatically replaces a fetched exchange candle.
      - name: Install pinned free PSX data client
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.PSX_OHLCV_URL_TEMPLATE == ''
        run: python -m pip install "git+https://github.com/umairsandhu/psx-dps@58944679119cb65c076cbafe96b5a0a1f516969d"
      - name: Restore PSX public market-only OHLCV cache
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.PSX_OHLCV_URL_TEMPLATE == ''
        uses: actions/cache/restore@v4
        with:
          path: psx-wealth-agent/data
          key: psx-ohlcv-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            psx-ohlcv-
      - name: Update daily PSX prices and progressively bootstrap missing history
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.PSX_OHLCV_URL_TEMPLATE == ''
        continue-on-error: true
        run: python incremental_collector.py --watchlist watchlist.txt --months 5 --bootstrap-limit 4 --output data

      - name: Import subscribed Capital Stake data when configured
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN != ''
        run: python capitalstake_feed.py --watchlist watchlist.txt --output data

      # Supplement missing history with APPROVED OCR CSV and matching provenance.
      # Drive is no longer an exclusive data source that disables the free feed.
      - name: Overlay manually verified Google Drive OHLCV screenshots
        if: github.event_name != 'push' && env.PSX_OHLCV_URL_TEMPLATE == '' && env.GDRIVE_FOLDER_ID != '' && env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        run: python drive_overlay.py --watchlist watchlist.txt --output data

      # The owner's EClear OHLC History CSV has separate SHA256 audit evidence.
      # This source is for technical research ONLY; never infer buy approval.
      - name: Overlay owner-trusted EClear broker history for research
        if: github.event_name != 'push' && env.PSX_OHLCV_URL_TEMPLATE == '' && env.GDRIVE_FOLDER_ID != '' && env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        run: python broker_eclear_ingest.py --watchlist watchlist.txt --output data

      - name: Preserve history cache, including approved supplementary dates
        if: always() && github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.PSX_OHLCV_URL_TEMPLATE == ''
        uses: actions/cache/save@v4
        with:
          path: psx-wealth-agent/data
          key: psx-ohlcv-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Analyze combined validated price history
        if: github.event_name != 'push' && env.PSX_OHLCV_URL_TEMPLATE == ''
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports
      - name: Analyze optional independently licensed CSV provider
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.PSX_OHLCV_URL_TEMPLATE != ''
        run: python agent.py --source provider --watchlist watchlist.txt --output reports

      - name: Email qualifying technical setups for human review
        if: github.event_name != 'push' && env.ALERT_EMAIL_TO != '' && env.ALERT_SMTP_USER != '' && env.ALERT_SMTP_APP_PASSWORD != ''
        run: python alerts.py --report reports/verdict.json --send
      - name: Privately review existing positions for exit and profit-taking signals
        if: github.event_name != 'push' && env.PSX_OHLCV_URL_TEMPLATE == '' && env.PORTFOLIO_HOLDINGS_JSON != '' && env.ALERT_EMAIL_TO != '' && env.ALERT_SMTP_USER != '' && env.ALERT_SMTP_APP_PASSWORD != ''
        run: python position_guard.py --report reports/verdict.json --data-dir data --send
      - name: Email not configured
        if: github.event_name != 'push' && (env.ALERT_EMAIL_TO == '' || env.ALERT_SMTP_USER == '' || env.ALERT_SMTP_APP_PASSWORD == '')
        run: echo "::notice::Research available in artifact; Gmail notification secrets are not fully configured."

      - name: Upload research report without account holdings or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-wealth-report
          path: psx-wealth-agent/reports/
          if-no-files-found: warn
          retention-days: 14
