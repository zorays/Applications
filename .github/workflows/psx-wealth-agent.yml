name: PSX Wealth Research

on:
  push:
    paths:
      - "psx-wealth-agent/**"
      - ".github/workflows/psx-wealth-agent.yml"
  workflow_dispatch:
  schedule:
    # 12:45 UTC = 17:45 PKT; GitHub scheduled actions can be delayed.
    - cron: "45 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: psx-wealth-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITALSTAKE_API_TOKEN: ${{ secrets.CAPITALSTAKE_API_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      PSX_OHLCV_URL_TEMPLATE: ${{ secrets.PSX_OHLCV_URL_TEMPLATE }}
      PSX_OHLCV_TOKEN: ${{ secrets.PSX_OHLCV_TOKEN }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - name: Check out analysis repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate all strategy and data-source rules offline
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Install pin-locked open-source PSX historical client
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && (env.GDRIVE_FOLDER_ID == '' || env.GDRIVE_SERVICE_ACCOUNT_JSON == '') && env.PSX_OHLCV_URL_TEMPLATE == ''
        run: python -m pip install "git+https://github.com/umairsandhu/psx-dps@58944679119cb65c076cbafe96b5a0a1f516969d"
      - name: Retrieve free daily OHLCV from PSX public history
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && (env.GDRIVE_FOLDER_ID == '' || env.GDRIVE_SERVICE_ACCOUNT_JSON == '') && env.PSX_OHLCV_URL_TEMPLATE == ''
        run: python psx_dps_feed.py --watchlist watchlist.txt --months 6 --output data
      - name: Analyze free PSX history
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && (env.GDRIVE_FOLDER_ID == '' || env.GDRIVE_SERVICE_ACCOUNT_JSON == '') && env.PSX_OHLCV_URL_TEMPLATE == ''
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports

      - name: Import licensed Capital Stake EOD data when configured
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN != ''
        run: python capitalstake_feed.py --watchlist watchlist.txt --output data
      - name: Analyze Capital Stake market data
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN != ''
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports

      - name: Import authorized Google Drive market CSVs when configured
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.GDRIVE_FOLDER_ID != '' && env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: python drive_ingest.py --watchlist watchlist.txt --output data
      - name: Analyze Google Drive market CSVs
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && env.GDRIVE_FOLDER_ID != '' && env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports

      - name: Analyze alternative licensed CSV provider when configured
        if: github.event_name != 'push' && env.CAPITALSTAKE_API_TOKEN == '' && (env.GDRIVE_FOLDER_ID == '' || env.GDRIVE_SERVICE_ACCOUNT_JSON == '') && env.PSX_OHLCV_URL_TEMPLATE != ''
        run: python agent.py --source provider --watchlist watchlist.txt --output reports

      - name: Email technically qualified setups for manual review only
        if: github.event_name != 'push' && env.ALERT_EMAIL_TO != '' && env.ALERT_SMTP_USER != '' && env.ALERT_SMTP_APP_PASSWORD != ''
        run: python alerts.py --report reports/verdict.json --send
      - name: Notify if no email sender configured
        if: github.event_name != 'push' && (env.ALERT_EMAIL_TO == '' || env.ALERT_SMTP_USER == '' || env.ALERT_SMTP_APP_PASSWORD == '')
        run: echo "::notice::Daily research available as an artifact. Emails not enabled until dedicated SMTP secrets are configured."

      - name: Upload nonpersonal technical research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-wealth-report
          path: psx-wealth-agent/reports/
          if-no-files-found: warn
          retention-days: 14
