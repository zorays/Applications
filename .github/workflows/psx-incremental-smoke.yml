name: PSX Incremental Data Smoke Test

on:
  push:
    paths:
      - ".github/workflows/psx-incremental-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psx-wealth-research
  cancel-in-progress: false

jobs:
  incrementally-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validated dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "git+https://github.com/umairsandhu/psx-dps@58944679119cb65c076cbafe96b5a0a1f516969d"
      - name: Verify offline incremental tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Restore market-only cached history
        uses: actions/cache/restore@v4
        with:
          path: psx-wealth-agent/data
          key: psx-ohlcv-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            psx-ohlcv-
      - name: Fetch one complete-market daily snapshot and at most four histories
        run: python incremental_collector.py --watchlist watchlist.txt --months 5 --bootstrap-limit 4 --output data
      - name: Preserve validated OHLCV for daily production runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: psx-wealth-agent/data
          key: psx-ohlcv-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Render safe research report
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports
      - name: Save one-off integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-psx-research
          path: psx-wealth-agent/reports/
          if-no-files-found: warn
          retention-days: 7
