name: PSX NML EClear Technical Research

on:
  push:
    paths:
      - "psx-wealth-agent/broker_eclear_ingest.py"
      - "psx-wealth-agent/test_broker_eclear_ingest.py"
      - "psx-wealth-agent/agent.py"
      - ".github/workflows/psx-nml-eclear-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nml-eclear:
    name: NML private EClear OHLCV research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - name: Checkout code (no broker credentials stored)
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate EClear broker import safeguards
        run: python -m unittest test_broker_eclear_ingest.py -v
      - name: Ingest NML owner's audited private EClear CSV
        run: python broker_eclear_ingest.py --symbols NML --watchlist watchlist.txt --output data
      - name: Render NML technical research without buy approval
        run: python agent.py --source csv --symbols NML --data-dir data --output reports
      - name: Copy provenance/availability into report artifact
        if: always()
        run: |
          mkdir -p reports
          if test -f data/eclear_import_summary.json; then cp data/eclear_import_summary.json reports/nml-eclear-import-summary.json; fi
      - name: Upload NML EClear research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nml-eclear-research
          path: |
            psx-wealth-agent/reports/verdict.json
            psx-wealth-agent/reports/verdict.md
            psx-wealth-agent/reports/nml-eclear-import-summary.json
          if-no-files-found: warn
          retention-days: 14
