name: PSX Free OHLCV End-to-End Test

on:
  push:
    paths:
      - "psx-wealth-agent/psx_dps_feed.py"
      - "psx-wealth-agent/test_psx_dps_feed.py"
      - ".github/workflows/psx-free-ohlcv-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sazew-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psx-wealth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis and fixed-version free source
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "git+https://github.com/umairsandhu/psx-dps@58944679119cb65c076cbafe96b5a0a1f516969d"
      - name: Validate OHLCV conversion with offline tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Import complete real PSX SAZEW OHLCV (6 monthly requests max)
        run: python psx_dps_feed.py --symbols SAZEW --months 6 --output data
      - name: Produce read-only daily technical report
        run: python agent.py --source csv --data-dir data --symbols-from-data-dir --output reports
      - name: Upload market-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sazew-free-ohlcv-validation
          path: psx-wealth-agent/reports/
          if-no-files-found: warn
          retention-days: 7
